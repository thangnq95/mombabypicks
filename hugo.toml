baseURL = "https://mombabypicks.com/"
languageCode = "en-us"
title = "Mom Baby Picks"
theme = "PaperMod"
paginate = 10

[params]
  description = "Honest baby gear picks and reviews for new moms"
  author = "Mom Baby Picks"
  amazonTag = "PLACEHOLDER-20"
  defaultTheme = "light"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  footer.text = "As an Amazon Associate, we earn from qualifying purchases."
  mainSections = ["posts"]

[params.homeInfoParams]
