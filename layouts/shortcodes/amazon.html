{{- $url := .Get "url" -}}
{{- $text := .Get "text" | default "Check Price on Amazon →" -}}
{{- $tag := site.Params.amazonTag -}}
{{- $separator := cond (in $url "?") "&" "?" -}}
{{- $finalUrl := cond (and $tag (not (in $url "tag="))) (printf "%s%stag=%s" $url $separator $tag) $url -}}
<a class="amazon-cta" href="{{ $finalUrl }}" target="_blank" rel="nofollow sponsored noopener">{{ $text }}</a>
