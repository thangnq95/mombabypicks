{{- $title := .Page.Title -}}
{{- $desc := .Page.Description -}}
{{- $url := .Page.Permalink -}}
{{- $img := index .Page.Params.images 0 -}}
<div class="share-bar">
  <span class="share-bar__label">Share:</span>
  <a href="https://pinterest.com/pin/create/button/?url={{ $url }}&description={{ $desc }}&media={{ $img | absURL }}" target="_blank" class="share-btn share-pinterest" title="Save to Pinterest">📌 Save</a>
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ $url }}" target="_blank" class="share-btn share-facebook" title="Share on Facebook">👍 Share</a>
  <a href="https://twitter.com/intent/tweet?url={{ $url }}&text={{ $desc }}" target="_blank" class="share-btn share-twitter" title="Share on X">🐦 Tweet</a>
</div>
