{{- $url := .Get "url" -}}
{{- $img := .Get "img" -}}
{{- $title := .Get "title" -}}
{{- $price := .Get "price" | default "" -}}
{{- $badge := .Get "badge" | default "🏆 OUR TOP PICK" -}}
<div class="top-pick-box">
  <div class="top-pick-badge">{{ $badge }}</div>
  <div class="top-pick-content">
    <div class="top-pick-image">
      <img src="{{ $img }}" alt="{{ $title }}" loading="lazy" />
    </div>
    <div class="top-pick-info">
      <h3 class="top-pick-title">{{ $title }}</h3>
      {{ if $price }}<div class="top-pick-price">{{ $price }}</div>{{ end }}
      <a href="{{ $url }}" target="_blank" rel="noopener noreferrer" class="top-pick-btn">Check Price on Amazon →</a>
    </div>
  </div>
</div>
