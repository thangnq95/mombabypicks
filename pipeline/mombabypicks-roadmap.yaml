project: MomBabyPicks
owner: Codex
role: "Growth and content optimization"
objective: "Increase qualified Amazon clicks and commissions by optimizing high-intent content and Pinterest assets before publishing more posts."
kpi_7_days:
  target: "Increase qualified traffic and Amazon clicks on the current top 5 pages"
  baseline:
    top_5_pageviews: 83
    top_5_affiliate_clicks: 35
  goals:
    - "Top-5 pageviews: 100+"
    - "Top-5 affiliate clicks: 45+"

rules:
  - "Do not test Amazon links on live pages unless necessary; use local or staged verification when possible."
  - "Keep layout, CSS, Hugo config, and templates unchanged unless explicitly required."
  - "Run scripts/verify.sh before any deploy."
  - "Prioritize pages with commercial intent over new article volume."

daily:
  - "Check Amazon clicks and commissions for the last 24 hours."
  - "Check top pages by clicks."
  - "Generate a GA4 affiliate-click snapshot and note the top page."
  - "Separate traffic quality into organic search, direct, dev/referral noise, and other sources."
  - "Review the latest dead-link scan summary from the external 3x/day service."
  - "Note one page to improve today."

week_1:
  - "Export top 10 pages by Amazon clicks."
  - "Group pages into: high clicks / low commission, high traffic / low Amazon clicks, strong Pinterest / weak site conversion."
  - "Identify the 5 pages with the strongest commercial intent."
  - "Confirm no live 404 Amazon links remain using the external link-scan service."
  - "Build a tracking sheet with page, clicks, commission, CTR, and notes."

week_2:
  - "Update the 5 highest-intent pages."
  - "Add an 'If You Only Want One...' section to each page."
  - "Add one short 'shortest answer' sentence near the end."
  - "Tighten CTA wording where needed."
  - "Add or improve internal links to related buying pages."
  - "Run scripts/verify.sh."
  - "Deploy after QA passes."

week_3:
  - "Review 3 pin images for each top page."
  - "Flag pins that look too similar in hook or message."
  - "Keep pins with distinct intent angles: best overall, budget, easiest, safest."
  - "Rewrite weak pin titles and descriptions if needed."
  - "Publish or refresh 3-pin packs for the strongest pages."

week_4:
  - "Review pages updated in Week 2."
  - "Compare clicks and commissions before vs after."
  - "Identify which wording pattern performed best."
  - "Apply the same pattern to the next 5 priority pages."
  - "Mark pages that do not deserve more work."
  - "Prepare the next month's priority list."

priority_pages:
  - best-baby-bottles-for-newborns-2026
  - best-baby-swings-2026
  - best-breast-pumps
  - best-diapers-for-newborns-2026
  - best-baby-bath-tubs-2026
  - best-baby-play-mats-2026
  - best-baby-sleep-sacks-for-2026
  - best-high-chairs-for-babies-2026
  - best-infant-car-seats-2026
  - best-bottle-warmers

success_signals:
  - "Amazon clicks rising on the right pages"
  - "Commission starts appearing"
  - "CTR improves after adding decision blocks"
  - "Pins produce more qualified traffic, not just more views"

